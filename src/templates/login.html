<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Rust RSS Server</title>
    <link rel="stylesheet" href="/static/css/tailadmin.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4">Log in</h1>
        <form id="login-form">
            <input type="hidden" name="next" value="{{ next }}">
            <input type="hidden" name="timezone" id="timezone">
            <label class="block mb-2 text-sm font-medium">Email</label>
            <input type="email" name="email" required class="w-full border p-2 rounded mb-4">

            <label class="block mb-2 text-sm font-medium">Password</label>
            <input type="password" name="password" required class="w-full border p-2 rounded mb-4">

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded">Log in</button>
        </form>
        <script>
            document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: form.email.value, password: form.password.value})
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    window.location.href = form.next.value || '/';
                } else {
                    alert('Login failed');
                }
            });
        </script>
    </div>
</body>
</html>
