<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rust RSS Server{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailadmin.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="text-xl font-bold text-gray-900">Rust RSS</a>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-gray-900">Dashboard</a>
                    <a href="/feeds" class="text-gray-700 hover:text-gray-900">Feeds</a>
                    <a href="/search" class="text-gray-700 hover:text-gray-900">Search</a>
                    <a href="/settings" class="text-gray-700 hover:text-gray-900">Settings</a>
                    <button id="logout" class="text-gray-700 hover:text-gray-900">Log out</button>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/star.js"></script>
    <script>
        document.getElementById('logout')?.addEventListener('click', async () => {
            const token = localStorage.getItem('refresh_token');
            if (token) {
                await fetch('/api/v1/auth/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: token })
                });
            }
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login';
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
