{% extends "base.html" %}

{% block title %}Articles — Rust RSS Server{% endblock %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Articles</h1>
    <form method="GET" action="/articles" class="flex items-center space-x-2">
        <select name="is_read" class="border rounded px-2 py-1">
            <option value="" {% if filter == "all" %}selected{% endif %}>All</option>
            <option value="false" {% if filter == "unread" %}selected{% endif %}>Unread</option>
            <option value="true" {% if filter == "read" %}selected{% endif %}>Read</option>
        </select>
        <select name="sort" class="border rounded px-2 py-1">
            <option value="oldest_first" {% if sort == "oldest_first" %}selected{% endif %}>Oldest first</option>
            <option value="newest_first" {% if sort == "newest_first" %}selected{% endif %}>Newest first</option>
        </select>
        <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded">Apply</button>
    </form>
</div>

{% include "article_list_partial.html" %}

{% if let Some(cursor) = next_cursor %}
<div class="mt-6">
    <a href="/articles?is_read={{ filter }}&sort={{ sort }}&cursor={{ cursor }}" class="text-blue-600 hover:underline">Next →</a>
</div>
{% endif %}
{% endblock %}
