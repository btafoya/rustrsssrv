{% extends "base.html" %}

{% block title %}Settings — Rust RSS Server{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Settings</h1>

<form id="settings-form" class="bg-white rounded-lg shadow p-6 max-w-lg space-y-4">
    <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" value="{{ email }}" class="w-full border rounded px-3 py-2">
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Timezone</label>
        <select name="timezone" id="timezone-select" class="w-full border rounded px-3 py-2"></select>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Default filter</label>
        <select name="default_filter" class="w-full border rounded px-3 py-2">
            <option value="all" {% if default_filter == "all" %}selected{% endif %}>All</option>
            <option value="unread" {% if default_filter == "unread" %}selected{% endif %}>Unread</option>
            <option value="read" {% if default_filter == "read" %}selected{% endif %}>Read</option>
            <option value="starred" {% if default_filter == "starred" %}selected{% endif %}>Starred</option>
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Default sort</label>
        <select name="default_sort_order" class="w-full border rounded px-3 py-2">
            <option value="oldest_first" {% if default_sort_order == "oldest_first" %}selected{% endif %}>Oldest first</option>
            <option value="newest_first" {% if default_sort_order == "newest_first" %}selected{% endif %}>Newest first</option>
        </select>
    </div>
    <div class="pt-4 border-t">
        <h2 class="text-sm font-semibold text-gray-700 mb-2">Change password</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Current password</label>
                <input type="password" name="current_password" autocomplete="current-password" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">New password</label>
                <input type="password" name="new_password" autocomplete="new-password" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Confirm new password</label>
                <input type="password" id="new-password-confirm" autocomplete="new-password" class="w-full border rounded px-3 py-2">
            </div>
        </div>
    </div>

    <p id="settings-error" class="text-red-600 text-sm hidden"></p>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
</form>

<script>
    const tzSelect = document.getElementById('timezone-select');
    if (tzSelect) {
        const savedTz = "{{ timezone }}";
        const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const zones = Intl.supportedValuesOf('timeZone');
        for (const zone of zones) {
            const option = document.createElement('option');
            option.value = zone;
            option.textContent = zone;
            tzSelect.appendChild(option);
        }
        tzSelect.value = savedTz && zones.includes(savedTz) ? savedTz : browserTz;
    }

    document.getElementById('settings-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorEl = document.getElementById('settings-error');
        errorEl.classList.add('hidden');
        errorEl.textContent = '';

        const newPassword = form.new_password.value;
        const confirmPassword = document.getElementById('new-password-confirm').value;
        if (newPassword && newPassword !== confirmPassword) {
            errorEl.textContent = 'New password and confirmation do not match.';
            errorEl.classList.remove('hidden');
            return;
        }

        const body = {};
        for (const [key, value] of new FormData(form)) {
            if (value) body[key] = value;
        }
        const token = localStorage.getItem('access_token');
        const res = await fetch('/api/v1/users/me', {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(body)
        });
        if (res.ok) {
            alert('Settings saved');
            window.location.reload();
        } else {
            let message = 'Failed to save settings';
            try {
                const data = await res.json();
                if (res.status === 401 && body.new_password) {
                    message = 'Current password is incorrect.';
                } else if (Array.isArray(data.details) && data.details.length) {
                    message = data.details.join('; ');
                } else if (data.message) {
                    message = data.message;
                }
            } catch {
                // ignore non-JSON error bodies
            }
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
