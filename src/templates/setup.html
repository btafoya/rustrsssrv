<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup — Rust RSS Server</title>
    <link rel="stylesheet" href="/static/css/tailadmin.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4">Create the first admin</h1>
        {% if let Some(error) = error %}
        <div class="bg-red-100 text-red-700 p-3 rounded mb-4">{{ error }}</div>
        {% endif %}
        <form method="post" action="/setup">
            <label class="block mb-2 text-sm font-medium">Email</label>
            <input type="email" name="email" value="{{ email }}" required class="w-full border p-2 rounded mb-4">

            <label class="block mb-2 text-sm font-medium">Password</label>
            <input type="password" name="password" required class="w-full border p-2 rounded mb-4">

            <label class="block mb-2 text-sm font-medium">Confirm password</label>
            <input type="password" name="password_confirmation" required class="w-full border p-2 rounded mb-4">

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded">Create account</button>
        </form>
    </div>
</body>
</html>
